# Production Worker (custom domains on enlistedhack.net; add enlistedhacks.net when zone is on this account).
name = "enlistedhacks"
main = "worker.mjs"
compatibility_date = "2025-10-11"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Host 301s in worker.mjs must run before a matching index.html is served.
run_worker_first = true

[[routes]]
pattern = "enlistedhack.net"
custom_domain = true

[[routes]]
pattern = "www.enlistedhack.net"
custom_domain = true

# Uncomment after adding zone enlistedhacks.net to this Cloudflare account (see docs/cloudflare-canonical-host.md):
# [[routes]]
# pattern = "enlistedhacks.net"
# custom_domain = true
# [[routes]]
# pattern = "www.enlistedhacks.net"
# custom_domain = true
