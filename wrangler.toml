# Production Worker — primary domain enlistedhack.net; enlistedhacks.net 301s here when zone is attached.
name = "enlistedhacks"
main = "worker.mjs"
compatibility_date = "2025-10-11"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Host 301s in worker.mjs must run before a matching index.html is served.
run_worker_first = true

[[routes]]
pattern = "enlistedhack.net"
custom_domain = true

[[routes]]
pattern = "www.enlistedhack.net"
custom_domain = true

# enlistedhacks.net zone is on another Cloudflare account — add routes after transfer (see docs/cloudflare-canonical-host.md).
