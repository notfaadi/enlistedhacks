# Static Astro site — Worker handles www/http/legacy host 301s; assets from dist/.
name = "enlisted-cheats-com"
main = "worker.mjs"
compatibility_date = "2025-10-11"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Attach when zone enlistedhacks.net is on this Cloudflare account:
# [[routes]]
# pattern = "enlistedhacks.net/*"
# zone_name = "enlistedhacks.net"
# [[routes]]
# pattern = "www.enlistedhacks.net/*"
# zone_name = "enlistedhacks.net"
